name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *" # Run every day at 00:00
  push:
    paths:
      - ".github/workflows/streak.yml" # Run any time this file is modified
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  generate-streak:
    runs-on: self-hosted
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=false&disable_animations=false
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          outputs: dist/streak.svg

      - name: push streak.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
