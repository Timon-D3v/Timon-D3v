name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *" # Run every day at 00:00
  push:
    paths:
      - ".github/workflows/streak.yml" # Run any time this file is modified
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=default&disable_animations=true
          path: static/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "Streak Stats [bot]"
          git config user.email "info@timondev.com"
          git add static/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
