name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *" # Run every day at 00:00
  push:
    paths:
      - ".github/workflows/streak.yml" # Run any time this file is modified
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  generate-streak:
    runs-on: self-hosted
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Generate streak stats (weekly)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&disable_animations=false&date_format=j%20M%5B%20Y%5D&mode=weekly
          path: dist/streak-weekly.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          outputs: dist/streak-weekly.svg

      - name: push streak-weekly.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate streak stats (daily)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&disable_animations=false&date_format=j%20M%5B%20Y%5D&mode=weekly
          path: dist/streak-daily.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          outputs: dist/streak-daily.svg

      - name: push streak-daily.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

